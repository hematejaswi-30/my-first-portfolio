  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- AI / Network Grid -->
  <g opacity="0.15" stroke="#60A5FA" stroke-width="1">
    <line x1="100" y1="100" x2="200" y2="180"/>
