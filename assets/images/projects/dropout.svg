  <!-- Brain / Analytics Icon -->
  <circle cx="300" cy="170" r="45" fill="#1A2232" stroke="url(#accentGrad)" stroke-width="2"/>
  <path d="M 285 170 L 295 180 L 315 155" fill="none" stroke="#C9A96E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="250" font-family="'Playfair Display', serif, sans-serif" font-size="22" font-weight="bold" fill="#F2EDE6" text-anchor="middle">AI Dropout Detection</text>
  <text x="300" y="278" font-family="'Inter', sans-serif" font-size="13" fill="#60A5FA" text-anchor="middle" letter-spacing="2">STUDENT COUNSELLING SYSTEM</text>
